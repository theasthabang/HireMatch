server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path that isn't a real file falls back to index.html
    # so client-side routing (if you add react-router later) doesn't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively, they're content-hashed by Vite so
    # a new build automatically gets new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}